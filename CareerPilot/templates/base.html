{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CareerPilot{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <a class="brand" href="{% url 'dashboard' %}">CareerPilot</a>
            {% if user.is_authenticated %}
            <nav class="main-nav" aria-label="Main navigation"><a href="{% url 'dashboard' %}">Applications</a><a href="{% url 'application_create' %}">Add job</a></nav>
                <div class="topbar-actions">
                    <span class="user-email">{{ user.email }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="button button-quiet" type="submit">Log out</button>
                    </form>
                </div>
            {% endif %}
        </header>
        <main class="content">{% block content %}{% endblock %}</main>
    </div>
</body>
</html>
